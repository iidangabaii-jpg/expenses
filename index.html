firebase.initializeApp(firebaseConfig);
var _fbDb = firebase.database();
var _fbRef = _fbDb.ref('expenses/shared');
var _saving = false;
var _lastSaveTs = 0;
var _listenerActive = false;

window.saveToFirebase = function(data) {
  _saving = true;
  _lastSaveTs = Date.now();
  _fbRef.set({ db: JSON.stringify(data), ts: _lastSaveTs })
    .then(function() {
      setTimeout(function() { _saving = false; }, 800);
      console.log('[FB] saved OK ts:', _lastSaveTs);
      if(typeof showSyncStatus === 'function') showSyncStatus('נשמר ✓', true);
    })
    .catch(function(e) {
      _saving = false;
      console.error('[FB] save error:', e.message);
      if(typeof showSyncStatus === 'function') showSyncStatus('שגיאת שמירה ✗', false);
    });
};

window.loadFromFirebase = function() {
  return new Promise(function(resolve) {
    if(_listenerActive) { resolve(false); return; }
    _listenerActive = true;
    _fbRef.on('value', function(snapshot) {
      var data = snapshot.val();
      if(!data || !data.db) { resolve(false); return; }
      if(_saving) return;
      if(data.ts && data.ts <= _lastSaveTs) { resolve(true); return; }
      console.log('[FB] update detected ts:', data.ts);
      _lastSaveTs = data.ts || 0;
      window.DB = JSON.parse(data.db);
      if(typeof window.renderCurrent === 'function') {
        window.renderCurrent();
        if(typeof showSyncStatus === 'function') showSyncStatus('עודכן ✓', true);
      }
      resolve(true);
    }, function(error) {
      console.error('[FB] listener error:', error.message);
      if(typeof showSyncStatus === 'function') showSyncStatus('שגיאת חיבור ✗', false);
      resolve(false);
    });
  });
};

<style>
:root{--bg:#f5f5f3;--sf:#fff;--br:rgba(0,0,0,.08);--bm:rgba(0,0,0,.13);--tx:#1a1a1a;--t2:#555;--t3:#999;--red:#c0392b;--green:#27664a;--r:14px;--rs:9px}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Heebo',sans-serif;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:'Heebo',sans-serif}

/* layout */
.app{max-width:680px;margin:0 auto;padding-bottom:76px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}
.topbar-title{font-size:16px;font-weight:600}
.topbar-date{font-size:12px;color:var(--t3)}

/* month strip */
.sw{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:4px}
.strip{display:flex;overflow-x:auto;padding:0 18px;scrollbar-width:none;border-bottom:1px solid var(--br)}
.strip::-webkit-scrollbar{display:none}
.mc{flex-shrink:0;padding:10px 13px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap}
.mc.active{color:var(--tx);border-bottom-color:var(--tx)}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--sf);border-top:1px solid var(--br);display:flex;z-index:20}
.nb{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--t3);font-size:11px;font-family:'Heebo',sans-serif;transition:color .15s}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:var(--tx)}

/* content */
.content{padding:14px 18px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:12px 14px}
.kpi-label{font-size:11px;color:var(--t3);margin-bottom:4px}
.kpi-val{font-size:19px;font-weight:600;line-height:1.15}
.kpi-val.neg{color:var(--red)}.kpi-val.pos{color:var(--green)}
.kpi-sub{font-size:10px;color:var(--t3);margin-top:3px}

/* add inline button */
.add-inline-btn{width:100%;padding:10px;margin-bottom:10px;background:var(--sf);border:1px dashed var(--bm);border-radius:var(--r);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.add-inline-btn:hover{background:var(--bg)}
.add-inline-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

/* card */
.card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.4px;text-transform:uppercase}
.card-total{font-size:13px;font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

/* rows */
.row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--br);gap:6px}
.row:last-child{border-bottom:none}
.rdt{font-size:11px;color:var(--t3);min-width:32px;text-align:center;flex-shrink:0}
.rb{flex:1;min-width:0}
.rdesc{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:11px;color:var(--t3);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{background:var(--br);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--t2);white-space:nowrap}
.ramt{font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.ib{border:none;background:none;cursor:pointer;color:var(--t3);padding:3px 4px;border-radius:5px;font-size:14px;line-height:1;flex-shrink:0}
.ib:hover{background:var(--br)}.ib.del:hover{color:var(--red)}
.empty-msg{font-size:12px;color:var(--t3);padding:4px 0}

/* cat bars */
.cr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--br)}
.cr:last-child{border-bottom:none}
.cn{font-size:12px;color:var(--t2);min-width:110px;flex-shrink:0}
.cbw{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.cbf{height:100%;border-radius:2px;background:var(--tx);opacity:.2}
.ca{font-size:12px;font-weight:600;min-width:60px;text-align:left;flex-shrink:0}

.pay-row:last-child{border-bottom:none}
.pay-name{color:var(--t2)}
.pay-amt{font-weight:600}

.fl{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px;letter-spacing:.2px}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-add{width:100%;padding:11px;font-size:14px;font-weight:600;border-radius:var(--rs);border:none;background:var(--tx);color:var(--bg);cursor:pointer;margin-top:4px;transition:opacity .15s}
.btn-add:hover{opacity:.85}
.bsec{padding:9px 16px;font-size:13px;border-radius:var(--rs);border:1px solid var(--bm);background:transparent;color:var(--t2);cursor:pointer;font-family:'Heebo',sans-serif}

/* yearly tabs */
.ytabs{display:flex;gap:8px;margin-bottom:12px}
.ytab{padding:7px 22px;font-size:13px;font-weight:500;border-radius:30px;border:1px solid var(--bm);background:transparent;cursor:pointer;color:var(--t2);font-family:'Heebo',sans-serif;transition:.15s}
.ytab.active{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.yr-bar-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--br)}
.yr-bar-row:last-child{border-bottom:none}
.yrl{font-size:13px;min-width:62px;flex-shrink:0}
.yrb{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.yrbf{height:100%;border-radius:3px;background:var(--tx);opacity:.25}
.yra{font-size:13px;font-weight:600;min-width:68px;text-align:left;flex-shrink:0}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sf);border-radius:var(--r) var(--r) 0 0;padding:20px 18px 34px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px}
.brow{display:flex;gap:8px;margin-top:6px}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--sf);border-radius:var(--r);padding:22px 18px;width:100%;max-width:320px;text-align:center}
.confirm-box p{font-size:14px;margin-bottom:16px;line-height:1.5}
.confirm-box .cbrow{display:flex;gap:8px;justify-content:center}
.confirm-box button{padding:9px 26px;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--bm);cursor:pointer;font-family:'Heebo',sans-serif}
.confirm-box .yes{background:var(--red);color:#fff;border-color:var(--red)}
.confirm-box .no{background:transparent;color:var(--t2)}

/* toast */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

    if(saved) { DB = JSON.parse(saved); return; }
  } catch(e){}
  // Build from Excel data
  DB = {};
  MONTHS_ORDER.forEach(m => {
    const src = EXCEL_DATA[m] || {entries:[]};
    DB[m] = {
      entries: (src.entries||[]).map(e=>({...e})),
      extra: [] // user-added entries
    };
    if(src.fixed_override) {
      DB[m].fixed_override = src.fixed_override.map(f=>({...f}));
    }
  });
}

function save(){
  try{ localStorage.setItem('expenses_db_v2', JSON.stringify(DB)); }catch(e){}
  // Save to Firebase for cross-device sync
  if(window.saveToFirebase) {
    window._lastSaveTs = Date.now();
    window.saveToFirebase(DB);
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
function fmtILS(n){return '₪'+Math.round(n).toLocaleString('he-IL')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

function getFixed(m){
  return (DB[m].fixed_override || DEFAULT_FIXED).map(f=>({
    ...f, m:'אשראי מורן', dt:'1', who:'מורן', _fixed:true
  }));
}

function getAllEntries(m){
  const d = DB[m]||{entries:[],extra:[]};
  return [...(d.entries||[]), ...(d.extra||[])];
}

function getMonthTotal(m){
  const fixed = showFixed ? getFixed(m) : [];
  const entries = getAllEntries(m);
  return entries.reduce((s,e)=>s+e.a,0) + fixed.reduce((s,f)=>s+f.a,0);
}

function calcMoranLeft(m){
  const entries = getAllEntries(m);
  const fixed = showFixed ? getFixed(m) : [];
  const moranSpend = [...entries,...fixed].filter(e=>e.who==='מורן').reduce((s,e)=>s+e.a,0);
  const sharedSpend = entries.filter(e=>e.who==='משותף').reduce((s,e)=>s+e.a,0);
  return SALARY - moranSpend - sharedSpend/2;
}

function getCat(d,m,who){
  const l=(d+' '+(m||'')+' '+(who||'')).toLowerCase();
  if(l.includes('דלק'))return 'דלק';
  if(l.includes('כלב')||l.includes('חיסון')||l.includes('מניאק')||(l.includes('תספורת')&&l.includes('טאי')))return 'כלב';
  if(l.includes('ברית')||l.includes('חתונה')||l.includes('מתנה'))return 'ברית/חתונה/מתנה';
  if(l.includes('רכב')||l.includes('צמיג')||l.includes('פרונט')||(l.includes('טסט')&&l.includes('רכב'))||l.includes('כיוון')||l.includes('קורקינט'))return 'רכב';
  if(l.includes('טיפוח')||l.includes('בוטוקס')||l.includes('ביוץ')||l.includes('לייזר')||l.includes('ציפורניים')||l.includes('טיפול פנים')||l.includes('לק'))return 'טיפוח';
  if(l.includes('בגד')||l.includes('נעל')||l.includes('חולצה')||l.includes('שיער')||l.includes('תיק')||l.includes('זארה')||l.includes('פוקס'))return 'ביגוד';
  if(l.includes('מסעדה')||l.includes('קפה')||l.includes('ארוחה')||l.includes('bbb')||l.includes('וולט')||l.includes('יקב')||l.includes('פיצה')||l.includes('רולדין')||l.includes('על האש')||l.includes('המבורגר')||l.includes('טוסט')||l.includes('יומולדת')||l.includes('מחנה יהודה'))return 'מסעדה ויציאות';
  if(l.includes('קניות')||l.includes('סופר')||l.includes('רמי')||l.includes('חינם')||l.includes('בשרים')||l.includes('תותים')||l.includes('נורדואו')||l.includes('שופרסל')||l.includes('הסטוק'))return 'קניות';
  if(who==='מורן'&&(l.includes('אישי')||l.includes('אישי מורן')))return 'אישי מורן';
  if(who==='עידן'&&l.includes('אישי'))return 'אישי עידן';
  return 'שאר';
}

function closeAdd(){const o=$('_addModal');if(o)o.remove()}
function monthFromDate(dtStr, fallback){
  // dtStr like "10.5" → month "5.26", "10.12" → "12.25"
  if(!dtStr || !dtStr.includes('.')) return fallback;
  const parts = dtStr.split('.');
  if(parts.length < 2) return fallback;
  const day = parseInt(parts[0]);
  const mon = parseInt(parts[1]);
  if(isNaN(day)||isNaN(mon)||mon<1||mon>12) return fallback;
  // Determine year: months 1-12 → 26, month 12 also check if it's 25
  // Simple rule: if current fallback month year suffix matches, use that
  const yr = mon === 12 ? '25' : '26';
  const key = mon + '.' + yr;
  return MONTHS_ORDER.includes(key) ? key : fallback;
}

function doAdd(){
  const dt=$('_aDt').value.trim();
  const selectedMonth=$('_aM').value;
  const m = monthFromDate(dt, selectedMonth); // auto-route by date
  const desc=$('_aDe').value.trim();
  const amt=parseFloat($('_aAm').value);
  const who=$('_aWho').value;
  const method=$('_aMeth').value;
  if(!desc||!amt){toast('נא למלא פירוט וסכום');return}
  if(!DB[m]) DB[m]={entries:[],extra:[]};
  if(!DB[m].extra) DB[m].extra=[];
  DB[m].extra.push({d:desc,m:method,a:amt,dt,who});
  save();
  closeAdd();
  const movedMsg = m !== selectedMonth ? ` (הועבר ל${MN[m]})` : '';
  toast(`✓ נוסף: ${desc} ${fmtILS(amt)}${movedMsg}`);
  curMonth=m;
  buildStrip();
  renderMonth();
}

    </div>
    <div class="card"><div class="card-head"><span class="card-title">לפי חודש</span></div>
      ${mData.length?mData.map(x=>`<div class="yr-bar-row"><div class="yrl">${MN[x.m]}</div><div class="yrb"><div class="yrbf" style="width:${Math.round(x.t/maxT*100)}%"></div></div><div class="yra">${fmtILS(x.t)}</div></div>`).join(''):'<div class="empty-msg">אין נתונים לשנה זו</div>'}
    </div>
    <div class="two-col">
      <div class="card"><div class="card-head"><span class="card-title">לפי קטגוריה</span></div>
        ${Object.entries(allCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cr"><div class="cn">${k}</div><div class="cbw"><div class="cbf" style="width:${Math.round(v/maxCat*100)}%"></div></div><div class="ca">${fmtILS(v)}</div></div>`).join('')||'<div class="empty-msg">אין נתונים</div>'}
      </div>
      <div class="card"><div class="card-head"><span class="card-title">אמצעי תשלום</span></div>
        ${Object.entries(payMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<div class="cr"><div class="cn" style="font-size:11px">${k}</div><div class="cbw"><div class="cbf" style="width:${Math.round(v/maxPay*100)}%"></div></div><div class="ca">${fmtILS(v)}</div></div>`).join('')||'<div class="empty-msg">אין נתונים</div>'}
      </div>
    </div>`;
}

// ─── FIXED ────────────────────────────────────────────────────────────────────
function renderFixed(){
  const total=DEFAULT_FIXED.reduce((s,f)=>s+f.a,0);
  $('view').innerHTML=`
    <div class="card">
      <div class="card-head"><span class="card-title">הוצאות קבועות מורן</span><span class="card-total">${fmtILS(total)}/חודש</span></div>
      <div class="kpi-sub" style="margin-bottom:10px;color:var(--t3)">מופיעות אוטומטית בכל חודש תחת מורן</div>
      ${DEFAULT_FIXED.map((f,i)=>`
        <div class="row">
          <div class="rdt">1</div>
          <div class="rb"><div class="rdesc">${f.d}</div><div class="rmeta"><span>אשראי מורן</span></div></div>
          <div class="ramt">${fmtILS(f.a)}</div>
          <button class="ib del" onclick="delFixed(${i})">✕</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">הוסף קבועה</span></div>
      <div class="f2">
        <div class="field"><div class="fl">פירוט</div><input id="_fD" placeholder="שם ההוצאה"></div>
        <div class="field"><div class="fl">סכום חודשי</div><input id="_fA" type="number" inputmode="decimal" placeholder="₪"></div>
      </div>
      <button class="btn-add" onclick="addFixed()">הוסף</button>
    </div>`;
}

function delFixed(i){
  confirm2(`למחוק "${DEFAULT_FIXED[i].d}" מהקבועות?`,()=>{
    DEFAULT_FIXED.splice(i,1);save();renderFixed();toast('נמחק');
  });
}
function addFixed(){
  const d=$('_fD').value.trim(),a=parseFloat($('_fA').value);
  if(!d||!a){toast('נא למלא');return}
  DEFAULT_FIXED.push({d,a});save();toast('✓ נוסף');renderFixed();
}

// ─── SYNC STATUS UI ──────────────────────────────────────────────────────────
function showSyncStatus(msg, ok){
  if(!msg) return;
  let el=document.getElementById('_syncStatus');
  if(!el){
    el=document.createElement('div');
    el.id='_syncStatus';
    el.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--br);border-radius:20px;padding:5px 16px;font-size:12px;z-index:999;transition:opacity .4s;box-shadow:0 2px 8px rgba(0,0,0,.15)';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.color=ok?'var(--green)':'var(--t3)';
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity='0',3000);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
window.renderCurrent = function(){
  if(curView==='month') renderMonth();
  else if(curView==='yearly') renderYearly();
  else if(curView==='fixed') renderFixed();
};

$('topDate').textContent=new Date().toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});

// Start immediately with local data, then sync Firebase in background
initDB();
buildStrip();
renderMonth();

// Firebase sync in background - non-blocking
if(window.loadFromFirebase){
  showSyncStatus('טוען...', false);
  window.loadFromFirebase().then(ok=>{
    if(ok){
      showSyncStatus('מסונכרן ✓', true);
      buildStrip();
      renderCurrent();
      console.log('[FB] initial load success');
    } else {
      showSyncStatus('לא מחובר', false);
      console.warn('[FB] no data in Firebase, using local');
    }
  }).catch(e=>{ 
    showSyncStatus('שגיאת חיבור', false);
    console.error('[FB] boot load error:', e);
  });
}
</script>

</html>
